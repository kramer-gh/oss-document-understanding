[project]
name = "docling-parser"
version = "0.2.0"
description = "Universal PDF and PPTX document parser (MCP server + CLI) built on Docling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TWS" }]
dependencies = [
    "docling>=2.0.0",
    "fastmcp>=2.3.0",
    "httpx>=0.27",
    "json-repair>=0.30.0",
    "pymupdf>=1.24.0",
    "python-pptx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.10.0",
]

[project.scripts]
docling-parser = "docling_parser.cli:main"
docling-parser-mcp = "docling_parser.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docling_parser"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that exercise the real Docling pipeline (first run downloads models)",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]